    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            color: #e8e8e8;
            font-family: 'Inter', -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            position: relative;
            overflow-x: hidden;
        }

        /* Автоматический круглый экран загрузки */
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0a0a;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }

        #loader.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .spinner-container {
            position: relative;
            width: 80px;
            height: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
        }

        .spinner {
            width: 100%;
            height: 100%;
            border: 3px solid rgba(255, 255, 255, 0.08);
            border-top: 3px solid #e60000;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loader-percent {
            position: absolute;
            font-size: 0.75rem;
            font-family: monospace;
            color: #ffffff;
            font-weight: 600;
        }

        .loader-sub {
            font-size: 0.65rem;
            color: rgba(255, 255, 255, 0.3);
            font-family: monospace;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at 30% 40%, rgba(255,255,255,0.02) 0%, transparent 50%),
                        radial-gradient(ellipse at 70% 60%, rgba(255,255,255,0.015) 0%, transparent 50%),
                        #0a0a0a;
            animation: bgMove 20s ease-in-out infinite alternate;
            z-index: 0;
        }

        @keyframes bgMove {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(2%, 2%) scale(1.05); }
        }

        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.6) 100%);
            pointer-events: none;
            z-index: 1;
        }

        .container {
            max-width: 720px;
            width: 100%;
            padding: 50px 48px;
            position: relative;
            z-index: 2;
            background: rgba(10,10,10,0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 24px;
            box-shadow: 0 40px 120px rgba(0,0,0,0.8);
            animation: fadeUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(30px);
        }

        @keyframes fadeUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.6rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2.5px;
            color: rgba(255,255,255,0.2);
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            margin-bottom: 32px;
        }

        .status-bar .dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #e60000;
            margin-right: 8px;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.8); }
        }

        .status-bar .right {
            display: flex;
            gap: 24px;
        }

        .status-bar .time {
            font-variant-numeric: tabular-nums;
            letter-spacing: 1px;
        }

        .nickname {
            font-size: 4.5rem;
            font-weight: 800;
            letter-spacing: -2px;
            line-height: 1;
            color: #fff;
            margin-bottom: 6px;
            background: linear-gradient(135deg, #ffffff 0%, #888888 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmer 3s ease-in-out infinite alternate;
        }

        @keyframes shimmer {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }

        .nickname-sub {
            font-size: 0.7rem;
            color: rgba(255,255,255,0.15);
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 24px;
            font-weight: 400;
        }

        .social-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            margin-bottom: 36px;
        }

        .social-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 16px;
            border-radius: 12px;
            text-decoration: none;
            color: rgba(255,255,255,0.35);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            background: transparent;
            border: 1px solid transparent;
        }

        .social-item:hover {
            background: rgba(255,255,255,0.03);
            border-color: rgba(255,255,255,0.06);
            color: #fff;
            transform: translateX(4px);
        }

        .social-item .icon {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            opacity: 0.4;
            transition: 0.3s;
        }

        .social-item:hover .icon {
            opacity: 1;
        }

        .social-item .icon svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .social-item .label {
            font-size: 0.75rem;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .social-item .arrow {
            margin-left: auto;
            font-size: 0.7rem;
            opacity: 0;
            transform: translateX(-8px);
            transition: all 0.3s ease;
            color: #e60000;
        }

        .social-item:hover .arrow {
            opacity: 1;
            transform: translateX(0);
        }

        .terminal {
            padding: 16px 20px;
            background: rgba(0,0,0,0.4);
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.04);
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 28px;
            font-family: 'Inter', monospace;
            font-size: 0.7rem;
            color: rgba(255,255,255,0.3);
        }

        .terminal .prompt {
            color: #e60000;
            font-weight: 700;
        }

        .terminal .cmd {
            color: rgba(255,255,255,0.5);
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        .terminal .cursor {
            display: inline-block;
            width: 2px;
            height: 18px;
            background: #e60000;
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .terminal .status {
            margin-left: auto;
            color: rgba(255,255,255,0.2);
        }

        @media (max-width: 600px) {
            .container {
                padding: 30px 24px;
            }
            .nickname {
                font-size: 3rem;
            }
            .social-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let audioBuffer = null;

        // Предзагрузка звука через Web Audio API (без задержек)
        fetch('re-zero-respawn.mp3')
            .then(res => res.arrayBuffer())
            .then(data => audioCtx.decodeAudioData(data))
            .then(buffer => {
                audioBuffer = buffer;
            })
            .catch(() => {});

        function playSound() {
            if (audioCtx && audioBuffer) {
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                const source = audioCtx.createBufferSource();
                source.buffer = audioBuffer;
                source.connect(audioCtx.destination);
                source.start(0);
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            const percentEl = document.getElementById('loader-percent');
            const loader = document.getElementById('loader');
            
            let progress = 0;
            const interval = setInterval(() => {
                progress += Math.floor(Math.random() * 10) + 6;
                if (progress > 100) progress = 100;
                
                percentEl.textContent = `${progress}%`;

                if (progress === 100) {
                    clearInterval(interval);
                    
                    // Попытка воспроизведения сразу после загрузки
                    playSound();

                    // Автоматическое скрытие лоадера без ожидания действий
                    setTimeout(() => {
                        loader.classList.add('hidden');
                    }, 300);
                }
            }, 60);
        });

        function updateKyivTime() {
            const timeElement = document.getElementById('kyiv-time');
            const options = {
                timeZone: 'Europe/Kyiv',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false
            };
            const kyivTimeStr = new Intl.DateTimeFormat('en-GB', options).format(new Date());
            timeElement.textContent = `KYIV ${kyivTimeStr}`;
        }

        setInterval(updateKyivTime, 1000);
        updateKyivTime();
    </script>
</body>
</html>
